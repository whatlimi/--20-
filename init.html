<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学乐园 · 初始化</title>
<style>
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;margin:0;background:linear-gradient(160deg,#fff8ec,#ffeef5,#e8f7f2);color:#3d2e2a}
  .box{text-align:center;padding:40px}
  h1{font-size:2rem;margin-bottom:16px}
  p{font-size:1.1rem;margin-bottom:24px;color:#7a6454}
  .done{font-size:1.3rem;font-weight:800;color:#4fc9ae}
  a{display:inline-block;font-size:1.2rem;font-weight:800;padding:14px 40px;background:linear-gradient(180deg,#7ee8d0,#4fc9ae);color:#fff;text-decoration:none;border-radius:20px;border:3px solid #3d2e2a;box-shadow:0 5px 0 #5b4636}
</style>
</head>
<body>
<div class="box">
<h1>🎈 数学乐园初始化</h1>
<div id="result"></div>
</div>
<script>
const keys = Object.keys(localStorage).filter(k => k.startsWith("math20_"));
keys.forEach(k => localStorage.removeItem(k));
const r = document.getElementById("result");
r.innerHTML = '<p class="done">✅ 已清除 ' + keys.length + ' 项数据</p><a href="math-20.html">开始使用 →</a>';
</script>
</body>
</html>
